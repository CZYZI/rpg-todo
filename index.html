<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG 待办冒险</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC',sans-serif;color:#e0e0e0;min-height:100vh;background:#1a1a2e}
/* 世界观选择 */
.world-select{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.world-select h1{font-size:2.4rem;margin-bottom:.3rem;color:#ffd700}
.subtitle{color:#aaa;margin-bottom:2rem;font-size:1.1rem}
.world-cards{display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:center}
.world-card{background:rgba(255,255,255,.06);border:2px solid #444;border-radius:16px;padding:1.5rem 2rem;cursor:pointer;transition:all .2s;width:240px;text-align:center}
.world-card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.world-icon{font-size:2.5rem;display:block;margin-bottom:.5rem}
.world-card h2{margin:.5rem 0;color:#fff}
.world-card p{font-size:.8rem;color:#aaa;margin:.2rem 0}
/* 顶部栏 */
.header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.5rem;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap;gap:.5rem;position:sticky;top:0;z-index:10}
.header-left{display:flex;align-items:center;gap:.5rem}
.world-name{font-weight:600;font-size:1.05rem}
.header-center{display:flex;align-items:center;gap:.7rem;flex:1;max-width:400px}
.level-badge{background:#ffd700;color:#1a1a2e;font-weight:700;padding:.2rem .6rem;border-radius:999px;font-size:.85rem;white-space:nowrap}
.xp-bar{flex:1;height:10px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;min-width:80px}
.xp-fill{height:100%;background:linear-gradient(90deg,#ffd700,#ffaa00);border-radius:999px;transition:width .4s}
.points{font-size:.85rem;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.streak-badge{font-size:.85rem;color:#ff6b6b}
.btn-shop,.btn-switch{padding:.35rem .8rem;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#e0e0e0;cursor:pointer;font-size:.85rem}
.btn-shop:hover,.btn-switch:hover{background:rgba(255,255,255,.15)}
/* 添加区 */
.add-section{padding:1.2rem 1.5rem}
.add-row{display:flex;gap:.5rem;margin-bottom:.5rem;flex-wrap:wrap}
.add-row input{flex:1;min-width:200px;padding:.6rem 1rem;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#e0e0e0;font-size:.95rem;outline:none}
.add-row input:focus{border-color:rgba(255,215,0,.5)}
.btn-add{padding:.6rem 1.2rem;border-radius:10px;border:none;background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a1a2e;font-weight:700;cursor:pointer;white-space:nowrap;font-size:.95rem}
.btn-import{padding:.6rem 1rem;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#e0e0e0;cursor:pointer;white-space:nowrap;font-size:.95rem}
.add-options{display:flex;gap:1.5rem;font-size:.85rem;color:#aaa;flex-wrap:wrap;margin-top:.5rem}
.add-options input[type=number]{width:60px;padding:.2rem .4rem;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#e0e0e0;margin:0 .3rem}
.add-options select{padding:.2rem .4rem;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:#1a1a2e;color:#e0e0e0}
/* 任务列表 */
.task-list{padding:0 1.5rem 2rem;max-width:800px;margin:0 auto}
.empty-state{text-align:center;padding:3rem 1rem;color:#888}
.empty-state p:first-child{font-size:1.2rem;margin-bottom:.5rem}
.task-card{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.2rem;border-radius:12px;border:1px solid rgba(255,255,255,.12);margin-bottom:.6rem;transition:all .2s}
.task-card:hover{border-color:rgba(255,255,255,.25)}
.task-card.done{opacity:.5}
.task-info{flex:1}
.task-desc{font-size:1rem;font-weight:500;margin-bottom:.3rem}
.task-meta{font-size:.78rem;color:#aaa}
.task-actions{display:flex;gap:.4rem;align-items:center}
.btn-complete{padding:.4rem .9rem;border-radius:8px;border:none;background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;cursor:pointer;font-weight:600;font-size:.85rem}
.btn-delete{background:none;border:none;cursor:pointer;font-size:1.1rem;opacity:.4;transition:opacity .2s}
.btn-delete:hover{opacity:1}
.section-title{margin:1.5rem 0 .8rem;font-size:1.1rem;color:#aaa}
/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#1e1e3a;border-radius:16px;padding:1.5rem 2rem;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;color:#e0e0e0}
.modal h3{margin-bottom:.5rem;color:#fff}
.modal textarea{width:100%;padding:.8rem;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#e0e0e0;font-size:.9rem;resize:vertical;margin:.5rem 0;font-family:inherit;outline:none}
.modal-btns{display:flex;gap:.5rem;margin-top:.8rem}
.file-import{margin-top:1rem;font-size:.85rem;color:#aaa}
/* 商店 */
.shop-points{font-size:.9rem;margin-bottom:.8rem;color:#aaa}
.shop-tabs{display:flex;gap:.4rem;margin-bottom:1rem}
.shop-tabs button{padding:.35rem .8rem;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#aaa;cursor:pointer;font-size:.85rem;font-family:inherit}
.shop-tabs button.active{background:rgba(255,215,0,.15);border-color:#ffd700;color:#ffd700}
.shop-items{display:flex;flex-direction:column;gap:.5rem}
.shop-item{display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;border-radius:10px;border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:all .2s;color:#e0e0e0;font-family:inherit}
.shop-item:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.05)}
.shop-item.owned{opacity:.5;cursor:default}
.item-name{flex:1}
.item-cost{color:#ffd700;font-weight:600;font-size:.9rem}
.item-owned{color:#4caf50;font-size:.85rem}
.btn-close{margin-top:1rem;padding:.5rem 1.5rem;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#e0e0e0;cursor:pointer;font-family:inherit;font-size:.95rem}
/* 真实奖励任务卡片 */
.reward-task-card{border:2px solid #ff69b4!important;background:rgba(255,105,180,.1)!important}
.reward-desc{color:#ff69b4!important;font-weight:500}
/* Toast */
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:.6rem 1.5rem;border-radius:10px;font-size:.9rem;z-index:200;animation:fadeInOut 2.5s ease forwards;pointer-events:none}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}85%{opacity:1}100%{opacity:0}}
/* 页脚 */
.footer{text-align:center;padding:1.5rem;font-size:.8rem;color:#666;border-top:1px solid rgba(255,255,255,.06)}
.footer-note{margin-top:.3rem;font-size:.75rem;color:#555}
/* 图鉴 */
.hidden{display:none!important}

/* 左侧角色立绘面板 */
.char-panel{position:fixed;left:0;top:0;bottom:0;width:160px;z-index:9;overflow:hidden;cursor:pointer;transition:width .3s}
.char-panel img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center top;pointer-events:none}
.char-panel-overlay{position:absolute;bottom:0;left:0;right:0;padding:1rem .6rem .8rem;background:linear-gradient(transparent,rgba(0,0,0,.85));pointer-events:none}
.char-panel-name{font-weight:700;font-size:.95rem;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.char-panel-title{font-size:.7rem;color:rgba(255,255,255,.7);margin-top:.1rem;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.char-panel-quote{font-size:.65rem;color:rgba(255,255,255,.5);margin-top:.3rem;font-style:italic;text-shadow:0 1px 2px rgba(0,0,0,.8)}

/* 图鉴弹窗 */
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:.8rem}
.gallery-card{border-radius:12px;border:1px solid rgba(255,255,255,.12);overflow:hidden;cursor:pointer;transition:all .2s;position:relative;background:rgba(255,255,255,.05)}
.gallery-card:hover:not(.locked){transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.gallery-card.locked{opacity:.4;cursor:not-allowed}
.gallery-card.equipped{border-color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.4)}
.gallery-card-img{width:100%;aspect-ratio:9/16;object-fit:cover;object-position:center top;display:block}
.gallery-card-lock{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8))}
.gallery-card-info{padding:.4rem .5rem .5rem;background:rgba(0,0,0,.4)}
.gallery-card-name{font-size:.78rem;font-weight:600;color:#fff}
.gallery-card-title{font-size:.65rem;color:#aaa;margin-top:.1rem}
.gallery-card-equipped-badge{position:absolute;top:.3rem;right:.3rem;background:#ffd700;color:#1a1a2e;font-size:.6rem;font-weight:700;padding:.15rem .35rem;border-radius:4px}
</style>
</head>

function save(key, value) {

  else if (key === 'checkinHistory') localStorage.setItem('rpg-checkin-history', JSON.stringify(value));
}

// ============ 通义千问 API 调用 ============
async function callQwenAPI(prompt, systemPrompt) {
  var apiKey = localStorage.getItem('qwen-api-key') || localStorage.getItem('qwen_api_key');
  if (!apiKey) {
    throw new Error('未找到 API Key，请在设置中配置通义千问 API Key');
  }
  
  var response = await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + apiKey,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      model: 'qwen-max',
      messages: [
        { role: 'system', content: systemPrompt || '你是一个创意写作助手，用生动有趣的语言将普通任务描述成冒险故事。' },
        { role: 'user', content: prompt }
      ],
      temperature: 0.8,
      max_tokens: 200,
    }),
  });
  
  if (!response.ok) {
    var errText = await response.text();
    throw new Error('API 调用失败: ' + response.status + ' ' + errText);
  }
  
  var data = await response.json();
  if (data.choices && data.choices[0] && data.choices[0].message) {
    return data.choices[0].message.content.trim();
  }
  throw new Error('API 返回格式错误');
}

// 生成 AI 任务描述
async function generateAITaskDesc(taskText, rewardName, worldKey) {
  var w = WORLDS[worldKey] || WORLDS.fantasy;
  var monster = w.monsters[Math.floor(Math.random() * w.monsters.length)];
  var place = w.places[Math.floor(Math.random() * w.places.length)];
  var verb = w.verbs[Math.floor(Math.random() * w.verbs.length)];
  
  var prompt = '任务：' + taskText + '\n奖励：' + rewardName + '\n世界观：' + w.name + '\n\n请用这个世界的冒险风格，将这个任务描述成一个15-25字的激动人心的冒险描述，格式如："在【XXX】击败【XXX】，完成【XXX】，赢取【XXX】奖励！"。只输出描述文字，不要其他内容。';
  
  try {
    var desc = await callQwenAPI(prompt);
    // 确保描述不要太长
    if (desc.length > 50) {
      desc = desc.substring(0, 47) + '...';
    }
    return desc;
  } catch (e) {
    // API 失败时使用默认生成
    var short = taskText.length > 6 ? taskText.slice(0,6) + '…' : taskText;
    var pts = Math.round(state.minutes * state.difficulty);
    return verb + '【' + short + '】— 在【' + place + '】击败【' + monster + '】，赢取【' + rewardName + '】！奖励' + pts + '积分';
  }
}

function showToast(msg) {
  if (state.toastTimer) clearTimeout(state.toastTimer);
  state.toast = msg;
  state.toastTimer = setTimeout(() => { state.toast = ''; render(); }, 2500);
  render();
}

function mockGenerate(todo, worldKey) {
  const w = WORLDS[worldKey];
  const monster = w.monsters[Math.floor(Math.random() * w.monsters.length)];
  const place = w.places[Math.floor(Math.random() * w.places.length)];
  const verb = w.verbs[Math.floor(Math.random() * w.verbs.length)];
  const short = todo.length > 8 ? todo.slice(0,8) + '…' : todo;
  const pts = Math.round(state.minutes * state.difficulty);
  return { desc: verb + '【' + short + '】— 在【' + place + '】击败【' + monster + '】，奖励' + pts + '积分', points: pts };
}

// ============ 事件绑定 ============
function bindMainEvents() {
  // 输入框回车
  var input = document.getElementById('todo-input');
  if (input) {
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addTodo();
    });
    input.addEventListener('input', function() { state.input = this.value; });
  }

  // 分钟/难度
  var minInput = document.getElementById('minutes-input');
  if (minInput) {
    minInput.addEventListener('change', function() { state.minutes = Number(this.value) || 30; });
  }
  var diffSelect = document.getElementById('difficulty-select');
  if (diffSelect) {
    diffSelect.addEventListener('change', function() { state.difficulty = Number(this.value); });
  }

  // 导入文本区
  var ta = document.getElementById('import-textarea');
  if (ta) {
    ta.addEventListener('input', function() { state.importText = this.value; });
  }

  // 文件上传
  var fi = document.getElementById('file-input');
  if (fi) {
    fi.addEventListener('change', handleFileImport);
  }
}

// ============ 核心逻辑 ============
function addTodo() {
  var text = state.input.trim();
  if (!text) return;
  var result = mockGenerate(text, state.world);
  var task = {
    id: Date.now() + Math.random(),
    text: text,
    desc: result.desc,
    points: result.points,
    difficulty: state.difficulty,
    minutes: state.minutes,
    done: false,
    created: new Date().toISOString(),
  };
  state.todos.unshift(task);
  save('todos', state.todos);
  state.input = '';
  var inputEl = document.getElementById('todo-input');
  if (inputEl) inputEl.value = '';
  showToast('✅ 任务已生成！');
  render();
}

function handleFileImport(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var lines = ev.target.result.split(/\r?\n/).map(function(l) { return l.trim(); }).filter(Boolean);
    var newTasks = [];
    lines.forEach(function(line) {
      var r = mockGenerate(line, state.world);
      newTasks.push({
        id: Date.now() + Math.random(),
        text: line,
        desc: r.desc,
        points: r.points,
        difficulty: state.difficulty,
        minutes: state.minutes,
        done: false,
        created: new Date().toISOString(),
      });
    });
    state.todos = newTasks.concat(state.todos);
    save('todos', state.todos);
    showToast('✅ 导入了 ' + newTasks.length + ' 个任务');
    render();
  };
  reader.readAsText(file);
}

function confirmBulkImport() {
  var lines = state.importText.split(/\r?\n/).map(function(l) { return l.trim(); }).filter(Boolean);
  if (lines.length === 0) return;
  var newTasks = [];
  lines.forEach(function(line) {
    var r = mockGenerate(line, state.world);
    newTasks.push({
      id: Date.now() + Math.random(),
      text: line,
      desc: r.desc,
      points: r.points,
      difficulty: state.difficulty,
      minutes: state.minutes,
      done: false,
      created: new Date().toISOString(),
    });
  });
  state.todos = newTasks.concat(state.todos);
  save('todos', state.todos);
  state.importText = '';
  state.showImport = false;
  showToast('✅ 导入了 ' + newTasks.length + ' 个任务');
  render();
}

function completeTask(id) {
  var today = new Date().toISOString().slice(0,10);
  var newStreak = state.streak;
  if (state.lastDate === today) {
    newStreak = state.streak + 1;
  } else {
    var yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    newStreak = state.lastDate === yesterday ? state.streak + 1 : 1;
  }
  var streakBonus = newStreak >= 3 ? 1.2 : 1.0;
  var finalPoints = 0;

  state.todos = state.todos.map(function(t) {
    if (t.id !== id || t.done) return t;
    finalPoints = Math.round(t.points * streakBonus);
    state.points += finalPoints;
    state.streak = newStreak;
    state.lastDate = today;
    save('points', state.points);
    save('streak', state.streak);
    save('lastDate', state.lastDate);
    showToast('🎉 +' + finalPoints + ' 积分！连击 x' + newStreak);
    return Object.assign({}, t, { done: true, completedAt: new Date().toISOString() });
  });

  state.level = Math.floor(state.points / 1000) + 1;
  save('todos', state.todos);
  save('level', state.level);
  render();
}

// ============ 签到功能 ============
function getTodayStr() {
  return new Date().toISOString().slice(0, 10);
}

function hasTodayCheckin() {
  var today = getTodayStr();
  return state.checkinHistory.indexOf(today) !== -1;
}

function doCheckin() {
  var today = getTodayStr();
  if (hasTodayCheckin()) {
    showToast('今天已经签到啦！明天再来 😊'); return;
  }
  // 记录签到
  state.checkinHistory.push(today);
  save('checkinHistory', state.checkinHistory);
  // 计算连续天数奖励
  var streak = getCheckinStreak();
  var bonus = streak >= 7 ? 100 : streak >= 3 ? 60 : 30;
  state.points += bonus;
  state.level = Math.floor(state.points / 1000) + 1;
  save('points', state.points);
  save('level', state.level);
  showToast('📅 签到成功！+' + bonus + ' XP | 连续签到 ' + streak + ' 天🔥');
  render();
}

function getCheckinStreak() {
  var streak = 0;
  var d = new Date();
  while (true) {
    var ds = d.toISOString().slice(0, 10);
    if (state.checkinHistory.indexOf(ds) !== -1) {
      streak++;
      d = new Date(d.getTime() - 86400000);
    } else { break; }
  }
  return streak;
}

      '</div>';
  }

  }

  var btnStyle = todayDone
    ? 'background:rgba(255,255,255,.1);color:#888;cursor:not-allowed;border:1px solid rgba(255,255,255,.1)'
    : 'background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a1a2e;cursor:pointer;border:none;font-weight:700';
  var nextBonus = streak + 1 >= 7 ? 100 : streak + 1 >= 3 ? 60 : 30;

  return '<div id="checkin-overlay" class="modal-overlay">' +
    '<div class="modal" style="max-width:420px;padding:1.5rem">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">' +
        '<h3 style="margin:0;font-size:1.15rem">📅 每日签到</h3>' +
        '<button data-action="close-checkin" style="background:none;border:none;color:#aaa;font-size:1.3rem;cursor:pointer;line-height:1">×</button>' +
      '</div>' +
      '<div style="display:flex;gap:.8rem;margin-bottom:1.2rem">' +
        '<div style="flex:1;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:12px;padding:.8rem;text-align:center">' +
          '<div style="font-size:1.8rem;font-weight:700;color:#ffd700">' + streak + '</div>' +
          '<div style="font-size:.75rem;color:#aaa">连续签到（天）</div>' +
        '</div>' +
        '<div style="flex:1;background:rgba(255,105,180,.1);border:1px solid rgba(255,105,180,.3);border-radius:12px;padding:.8rem;text-align:center">' +
          '<div style="font-size:1.8rem;font-weight:700;color:#ff69b4">' + state.checkinHistory.length + '</div>' +
          '<div style="font-size:.75rem;color:#aaa">累计签到（天）</div>' +

          '<div style="font-size:1.8rem;font-weight:700;color:#4caf50">' + (todayDone ? (streak >= 7 ? '+100' : streak >= 3 ? '+60' : '+30') : (nextBonus >= 100 ? '+100' : nextBonus >= 60 ? '+60' : '+30')) + ' XP</div>' +
          '<div style="font-size:.75rem;color:#aaa">' + (todayDone ? '今日已领' : '签到奖励') + '</div>' +
        '</div>' +

      '<div style="margin-bottom:1rem">' +
        '<div style="font-size:.8rem;color:#888;margin-bottom:.5rem">最近 7 天</div>' +

      '</div>' +
      '<button data-action="do-checkin" style="width:100%;padding:.7rem;border-radius:10px;font-size:1rem;font-family:inherit;' + btnStyle + '">' +

function buyItem(itemId) {
  var item = null;
  for (var i = 0; i < SHOP_ITEMS.length; i++) {
    if (SHOP_ITEMS[i].id === itemId) { item = SHOP_ITEMS[i]; break; }
  }
  if (!item) { showToast('⚠️ 商品不存在！'); return; }
  if (state.points < item.cost) { showToast('⚠️ 积分不足！'); return; }
  // 确保 state.skins 是数组
  if (!Array.isArray(state.skins)) state.skins = [];
  if (state.skins.indexOf(item.id) >= 0) { showToast('⚠️ 已拥有！'); return; }
  state.points -= item.cost;
  state.skins.push(item.id);
  save('points', state.points);
  save('skins', state.skins);
  // 验证保存成功
  var saved = JSON.parse(localStorage.getItem('rpg-skins') || '[]');
  if (saved.indexOf(item.id) < 0) {
    console.error('保存失败！item.id:', item.id, 'saved:', saved);
  }
  showToast('🎉 获得【' + item.name + '】！');
  // 延迟一点渲染，确保状态已更新
  setTimeout(function() { render(); }, 50);
}

// ============ 真实奖励任务 ============
function startRewardTask(rewardId) {
  var reward = null;
  for (var i = 0; i < REAL_REWARDS.length; i++) {
    if (REAL_REWARDS[i].id === rewardId) { reward = REAL_REWARDS[i]; break; }
  }
  if (!reward) { showToast('⚠️ 奖励不存在！'); return; }
  if (state.points < reward.cost) { showToast('⚠️ 积分不足！'); return; }
  state.pendingReward = reward;
  state.pendingRewardMinutes = 30;
  render();
}

async function generateRewardTask() {
  var taskInput = document.getElementById('reward-task-input');
  var minutesInput = document.getElementById('reward-minutes-input');
  if (!taskInput || !state.pendingReward) return;
  
  var taskText = taskInput.value.trim();
  if (!taskText) { showToast('⚠️ 请输入任务目标！'); return; }
  
  var minutes = parseInt(minutesInput.value) || 30;
  var reward = state.pendingReward;
  
  // 显示加载状态
  document.getElementById('reward-ai-hint').classList.add('hidden');
  document.getElementById('reward-loading').classList.remove('hidden');
  document.getElementById('btn-gen-reward').disabled = true;
  
  try {
    var desc = await generateAITaskDesc(taskText, reward.name, state.world);
    var pts = Math.round(minutes * state.difficulty);
    
    // 保存预览信息
    state.pendingRewardDesc = desc;
    state.pendingRewardPoints = pts;
    state.pendingRewardTaskText = taskText;
    state.pendingRewardMinutes = minutes;
    
    // 显示预览
    document.getElementById('reward-loading').classList.add('hidden');
    document.getElementById('reward-preview').classList.remove('hidden');
    document.getElementById('reward-preview-text').textContent = desc;
    document.getElementById('reward-preview-meta').textContent = '预估耗时：' + minutes + '分钟 | 难度：×' + state.difficulty + ' | 奖励：' + pts + ' XP + ' + reward.name;
    
    // 改变按钮
    var btn = document.getElementById('btn-gen-reward');
    btn.textContent = '✅ 确认创建任务';
    btn.onclick = confirmRewardTask;
    btn.disabled = false;
  } catch (e) {
    document.getElementById('reward-loading').classList.add('hidden');
    document.getElementById('reward-ai-hint').classList.remove('hidden');
    document.getElementById('reward-ai-hint').innerHTML = '<span style="color:#ff6b6b">⚠️ ' + escHtml(e.message) + '</span>';
    document.getElementById('btn-gen-reward').disabled = false;
  }
}

function confirmRewardTask() {
  if (!state.pendingReward || !state.pendingRewardDesc) return;
  
  var reward = state.pendingReward;
  var task = {
    id: Date.now() + Math.random(),
    taskText: state.pendingRewardTaskText,
    desc: state.pendingRewardDesc,
    rewardId: reward.id,
    rewardName: reward.name,
    points: state.pendingRewardPoints,
    minutes: state.pendingRewardMinutes,
    difficulty: state.difficulty,
    claimed: false,
    created: new Date().toISOString(),
  };
  
  // 扣除积分
  state.points -= reward.cost;
  save('points', state.points);
  
  // 添加任务
  state.rewardTasks.unshift(task);
  save('rewardTasks', state.rewardTasks);
  
  // 清理状态
  state.pendingReward = null;
  state.pendingRewardDesc = null;
  state.pendingRewardPoints = null;
  state.pendingRewardTaskText = null;
  
  showToast('🎯 奖励任务已创建！完成后记得兑换奖励哦！');
  render();
}

function cancelRewardTask() {
  state.pendingReward = null;
  state.pendingRewardDesc = null;
  state.pendingRewardPoints = null;
  state.pendingRewardTaskText = null;
  render();
}

function claimReward(id) {
  var task = null;
  var taskIndex = -1;
  for (var i = 0; i < state.rewardTasks.length; i++) {
    if (state.rewardTasks[i].id === id) { task = state.rewardTasks[i]; taskIndex = i; break; }
  }
  if (!task || task.claimed) { showToast('⚠️ 任务不存在！'); return; }
  
  // 标记为已兑换
  state.rewardTasks[taskIndex].claimed = true;
  state.rewardTasks[taskIndex].claimedAt = new Date().toISOString();
  save('rewardTasks', state.rewardTasks);
  
  showToast('🎉 恭喜！你可以兑现【' + task.rewardName + '】了！');
  render();
}

function deleteRewardTask(id) {
  state.rewardTasks = state.rewardTasks.filter(function(t) { return t.id !== id; });
  save('rewardTasks', state.rewardTasks);
  render();
}

// ============ 设置功能 ============
function openSettings() {
  state.showSettings = true;
  state.apiKey = localStorage.getItem('qwen-api-key') || '';
  render();
}

function saveSettings() {
  var input = document.getElementById('api-key-input');
  if (!input) return;
  var key = input.value.trim();
  state.apiKey = key;
  localStorage.setItem('qwen-api-key', key);
  state.showSettings = false;
  if (key) {
    showToast('✅ API Key 已保存！现在可以用 AI 生成任务了');
  } else {
    showToast('⚠️ API Key 已清空');
  }
  render();
}

function cancelSettings() {
  state.showSettings = false;
  render();
}

// ============ 应用皮肤 ============
function applySkin() {
  if (!state.activeSkin || !SKIN_CONFIG[state.activeSkin]) {
    var oldStyle = document.getElementById('skin-dynamic-style');
    if (oldStyle) oldStyle.remove();
    return;
  }
  var cfg = SKIN_CONFIG[state.activeSkin];
  var styleEl = document.getElementById('skin-dynamic-style');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'skin-dynamic-style';
    document.head.appendChild(styleEl);
  }
  styleEl.textContent =
    '.btn-add{background:linear-gradient(135deg,' + cfg.accent + ',' + cfg.accent + '88)!important}' +
    '.xp-fill{background:linear-gradient(90deg,' + cfg.accent + ',' + cfg.accent + '88)!important}' +
    '.level-badge{background:' + cfg.accent + '!important;color:#1a1a2e!important}';
}

// ============ HTML 转义 ============
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(str) {
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============ 全局点击委托（唯一入口，不需要重新绑定） ============
document.addEventListener('click', function(e) {
  // 1. [data-action] 元素（按钮、操作）
  var actionEl = e.target.closest('[data-action]');
  if (actionEl) {
    var action = actionEl.getAttribute('data-action');
    if (action === 'add-todo') { addTodo(); return; }
    if (action === 'open-import') { state.showImport = true; render(); return; }
    if (action === 'confirm-import') { confirmBulkImport(); return; }
    if (action === 'cancel-import') { state.showImport = false; render(); return; }
    if (action === 'open-shop') { state.shopOpen = true; render(); return; }
    if (action === 'close-shop') { state.shopOpen = false; render(); return; }
    if (action === 'switch-world') { state.world = ''; render(); return; }
    if (action === 'complete') { completeTask(Number(actionEl.getAttribute('data-id'))); return; }
    if (action === 'delete') { deleteTask(Number(actionEl.getAttribute('data-id'))); return; }
    if (action === 'use-skin') {
      var uId = actionEl.getAttribute('data-item-id');
      state.activeSkin = uId; save('activeSkin', uId);
      showToast('🎨 已切换主题！'); render(); return;
    }
    if (action === 'use-char') {
      var ucId = actionEl.getAttribute('data-item-id');
      state.activeChar = ucId; save('activeChar', ucId);
      var cc = CHAR_CONFIG[ucId];
      showToast((cc ? cc.avatar + ' ' + cc.name : '角色') + ' 已装备！'); render(); return;
    }
    if (action === 'buy-item') {
      var bId = actionEl.getAttribute('data-item-id');
      buyItem(bId); return;
    }
    // 真实奖励任务操作
    if (action === 'start-reward') {
      var rId = actionEl.getAttribute('data-reward-id');
      startRewardTask(rId); return;
    }
    if (action === 'claim-reward') {
      claimReward(Number(actionEl.getAttribute('data-id'))); return;
    }
    if (action === 'delete-reward') {
      deleteRewardTask(Number(actionEl.getAttribute('data-id'))); return;
    }
    // 设置操作
    if (action === 'open-settings') { openSettings(); return; }
    if (action === 'save-settings') { saveSettings(); return; }
    if (action === 'cancel-settings') { cancelSettings(); return; }
    // 签到操作
    if (action === 'open-checkin') { state.checkinOpen = true; render(); return; }
    if (action === 'close-checkin') { state.checkinOpen = false; render(); return; }
    if (action === 'do-checkin') { doCheckin(); return; }
    if (action === 'open-gallery') { state.galleryOpen = true; render(); return; }
    if (action === 'close-gallery') { state.galleryOpen = false; render(); return; }
    // 奖励弹窗生成/取消按钮
    if (action === 'generate-reward') {
      var genBtn = document.getElementById('btn-gen-reward');
      if (!genBtn || genBtn.disabled) return;
      generateRewardTask(); return;
    }
    if (action === 'cancel-reward') { cancelRewardTask(); return; }
    return;
  }
  // 2. 世界观卡片
  var worldCard = e.target.closest('.world-card');
  if (worldCard) {
    state.world = worldCard.getAttribute('data-world');
    save('world', state.world); render(); return;
  }
  // 3. 商店 tab
  var tabBtn = e.target.closest('[data-shoptab]');
  if (tabBtn) {
    state.shopTab = tabBtn.getAttribute('data-shoptab');
    render(); return;
  }
  // 4. 商店遮罩点击关闭（点遮罩本身，不点 modal 内部）
  var shopOverlay = document.getElementById('shop-overlay');
  if (shopOverlay && shopOverlay.contains(e.target) && !shopOverlay.querySelector('.modal').contains(e.target)) {
    state.shopOpen = false; render(); return;
  }
  // 5. 导入遮罩点击关闭
  var importOverlay = document.getElementById('import-overlay');
  if (importOverlay && importOverlay.contains(e.target) && !importOverlay.querySelector('.modal').contains(e.target)) {
    state.showImport = false; render(); return;
  }
  // 6. 奖励弹窗点击关闭
  var rewardOverlay = document.getElementById('reward-overlay');
  if (rewardOverlay && rewardOverlay.contains(e.target) && !rewardOverlay.querySelector('.modal').contains(e.target)) {
    cancelRewardTask(); return;
  }
  // 7. 签到弹窗点击遮罩关闭
  var checkinOverlay = document.getElementById('checkin-overlay');
  if (checkinOverlay && checkinOverlay.contains(e.target) && !checkinOverlay.querySelector('.modal').contains(e.target)) {
    state.checkinOpen = false; render(); return;
  }
  // 8. 图鉴弹窗点击遮罩关闭
  var galleryOverlay = document.getElementById('gallery-overlay');
  if (galleryOverlay && galleryOverlay.contains(e.target) && !galleryOverlay.querySelector('.modal').contains(e.target)) {
    state.galleryOpen = false; render(); return;
  }
});

// ============ 首次渲染 ============
render();

// ============ 输入框回车支持 ============
document.addEventListener('keydown', function(ev) {
  if (ev.key !== 'Enter') return;
  // 奖励任务输入框回车 → 生成任务
  if (ev.target.id === 'reward-task-input') {
    var btn = document.getElementById('btn-gen-reward');
    if (btn && !btn.disabled) generateRewardTask();
  }
});
</script>
</body>
</html>
